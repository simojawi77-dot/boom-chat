services:
  db:
    image: postgres:16-alpine
    container_name: boom_chat_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boom_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boom_chat_backend
    environment:
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: boom_chat
      JWT_ACCESS_SECRET: dev_access_secret_change_in_production
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_production
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev -- --host 0.0.0.0 --port 3000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boom_chat_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      HOSTNAME: 0.0.0.0
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --hostname 0.0.0.0 --port 3001

volumes:
  postgres_data:
    driver: local
    db configs:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
